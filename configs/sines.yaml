dataset: sines
model:
  params:
    n_layer_enc:        2
    n_layer_dec:        2
    d_model:            64
    n_experts:          4
    dz:                 32
    timesteps:          500
    sampling_timesteps: 50
    lambda_wta:         0.01
    lambda_bal:         0.001
